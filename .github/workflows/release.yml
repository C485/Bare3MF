name: Auto Release (.NET)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Invalid release tag: ${{ github.ref_name }}"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"

      - name: Restore dependencies
        run: dotnet restore Bare3MF.csproj

      - name: Build project
        run: dotnet build Bare3MF.csproj --configuration Release --no-restore -p:Version=${{ env.VERSION }}

      - name: Publish standalone build
        run: dotnet publish Bare3MF.csproj --configuration Release --runtime win-x64 --self-contained true --output ./publish/standalone -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ env.VERSION }}

      - name: Publish framework-dependent build
        run: dotnet publish Bare3MF.csproj --configuration Release --runtime win-x64 --self-contained false --output ./publish/framework-dependent -p:PublishSingleFile=true -p:Version=${{ env.VERSION }}

      - name: Show published files
        shell: pwsh
        run: |
          Get-ChildItem ./publish/standalone | Select-Object Name, Length
          Get-ChildItem ./publish/framework-dependent | Select-Object Name, Length

      - name: Create release archives
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/standalone/* -DestinationPath "./Bare3MF-${{ github.ref_name }}-win-x64-standalone.zip" -Force
          Compress-Archive -Path ./publish/framework-dependent/* -DestinationPath "./Bare3MF-${{ github.ref_name }}-win-x64-framework-dependent.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Bare3MF-${{ github.ref_name }}-win-x64-standalone.zip
            Bare3MF-${{ github.ref_name }}-win-x64-framework-dependent.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
